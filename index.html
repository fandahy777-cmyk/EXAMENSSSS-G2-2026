<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plateforme Pédagogique & Examen — G2 I, G2 II, G2 III</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --accent: #0f766e;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 20px 24px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 1.35rem; margin-bottom: 4px; }
    header p { font-size: 0.9rem; opacity: 0.92; }

    .class-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .class-btn {
      flex: 1;
      min-width: 170px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .class-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary-dark);
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--card);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      margin-bottom: 20px;
    }

    .lock-box {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      max-width: 460px;
      margin: 10px auto;
    }

    .lock-box h3 {
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .module-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      background: #fafcff;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .module-title { font-size: 1.06rem; font-weight: 700; color: var(--primary-dark); }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--text);
    }

    .badge.done { background: #dcfce7; color: var(--success); }

    .objective {
      font-size: 0.92rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }

    ul, ol { padding-left: 20px; margin: 8px 0; }
    li { margin-bottom: 5px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.88rem;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    th { background: #f1f5f9; font-weight: 700; }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      margin-top: 8px;
    }

    .btn.secondary {
      background: #e2e8f0;
      color: var(--text);
      margin-left: 8px;
    }

    .btn.danger {
      background: var(--danger);
      color: #fff;
      margin-left: 8px;
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 0.82rem;
      margin-top: 0;
    }

    .question-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .question-box label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    input[readonly] {
      background: #f1f5f9;
      color: var(--muted);
      font-weight: 600;
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
    }

    .feedback.ok { background: #dcfce7; color: var(--success); }
    .feedback.err { background: #fee2e2; color: var(--danger); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #f8fafc;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Espace Numérique — G2 I, G2 II & G2 III</h1>
        <p>Cours complets, exercices, examen sécurisé et suivi administratif</p>
      </div>
      <button class="btn secondary small" onclick="lockAllSessions()">Verrouiller la session</button>
    </header>

    <!-- Sélecteur de classe -->
    <div class="class-bar" role="tablist" aria-label="Choisir une classe">
      <button class="class-btn active" data-class="G2 I" onclick="selectClass('G2 I')">
        G2 I — Informatique de base
      </button>
      <button class="class-btn" data-class="G2 II" onclick="selectClass('G2 II')">
        G2 II — Traitement de texte (Word)
      </button>
      <button class="class-btn" data-class="G2 III" onclick="selectClass('G2 III')">
        G2 III — Tableur (Excel)
      </button>
    </div>

    <!-- Onglets principaux -->
    <div class="tabs-bar" role="tablist" aria-label="Sections">
      <button class="tab-btn active" id="tab-cours" onclick="selectTab('cours')">1. Cours</button>
      <button class="tab-btn" id="tab-exercices" onclick="selectTab('exercices')">2. Exercices</button>
      <button class="tab-btn" id="tab-examen" onclick="selectTab('examen')">3. Examen (Verrouillé)</button>
      <button class="tab-btn" id="tab-admin" onclick="selectTab('admin')">4. Admin</button>
    </div>

    <!-- Zone dynamique -->
    <main id="content-area" class="panel"></main>
  </div>

  <script>

                <li><strong>Périphériques :</strong> d'entrée (clavier, souris, micro), de sortie (écran, imprimante, haut-parleurs) et de stockage externe (clé USB).</li>

            contenuHtml: `

          {

            contenuHtml: `
              <ul>
                <li><strong>Fichier :</strong> document enregistré avec un nom et une extension (<code>.docx</code>, <code>.xlsx</code>, <code>.pdf</code>, <code>.jpg</code> / <code>.png</code>).</li>

        exercices: [
          {

            titre: "Module 2.2 : Mise en forme des caractères et des paragraphes (Accueil)",

            contenuHtml: `
              <ul>
                <li><strong>Police :</strong> choix de la police, taille, <strong>Gras</strong> (<code>Ctrl + G</code>), <em>Italique</em> (<code>Ctrl + I</code>), <u>Souligné</u> (<code>Ctrl + U</code>), couleur et <em>Effacer toute la mise en forme</em>.</li>

    let currentClass = "G2 I";
    let currentTab = "cours";
    let unlockedClasses = new Set();
    let examUnlocked = false;
    let adminUnlocked = false;
    let lockErrorMessage = "";

    function getCompletedModules() {
      try {
        return JSON.parse(localStorage.getItem("completedModules_G2") || "[]");
      } catch {
        return [];
      }
    }

    function getSubmissions() {
      try {
        return JSON.parse(localStorage.getItem("examSubmissions_G2") || "[]");
      } catch {
        return [];
      }
    }

    function saveSubmission(entry) {
      const list = getSubmissions();
      list.unshift(entry);
      localStorage.setItem("examSubmissions_G2", JSON.stringify(list));
    }

    function toggleModuleDone(moduleId) {
      const done = new Set(getCompletedModules());
      if (done.has(moduleId)) done.delete(moduleId);
      else done.add(moduleId);
      localStorage.setItem("completedModules_G2", JSON.stringify([...done]));
      render();
    }

    function lockAllSessions() {
      unlockedClasses.clear();
      examUnlocked = false;
      adminUnlocked = false;
      lockErrorMessage = "";
      render();
    }

    function selectClass(cls) {
      currentClass = cls;
      lockErrorMessage = "";
      document.querySelectorAll(".class-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.class === cls);
      });
      render();
    }

    function selectTab(tab) {
      currentTab = tab;
      lockErrorMessage = "";
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      render();
    }

    function renderLockScreen(title, subtitle, onSubmitFnName) {
      return `
        <div class="lock-box">
          <h3>${title}</h3>
          <p style="font-size:0.9rem; color:var(--muted); margin-bottom:12px;">${subtitle}</p>
          <form onsubmit="${onSubmitFnName}(event)">
            <label for="unlock-pwd"><strong>Mot de passe</strong></label>
            <input type="password" id="unlock-pwd" placeholder="Saisir le mot de passe" required />
            <button type="submit" class="btn">Déverrouiller</button>
          </form>
          ${lockErrorMessage ? `<div class="feedback err">${lockErrorMessage}</div>` : ""}
        </div>
      `;
    }

    window.handleClassUnlock = function(e) {
      e.preventDefault();
      const input = document.getElementById("unlock-pwd").value;
      if (input === PASSWORDS.classes[currentClass]) {
        unlockedClasses.add(currentClass);
        lockErrorMessage = "";
      } else {
        lockErrorMessage = "Mot de passe incorrect pour la classe " + currentClass + ".";
      }
      render();
    };

    window.handleExamUnlock = function(e) {
      e.preventDefault();
      const input = document.getElementById("unlock-pwd").value;
      if (input === PASSWORDS.examen) {
        examUnlocked = true;
        lockErrorMessage = "";
      } else {
        lockErrorMessage = "Mot de passe d'examen incorrect.";
      }
      render();
    };

    window.handleAdminUnlock = function(e) {
      e.preventDefault();
      const input = document.getElementById("unlock-pwd").value;
      if (input === PASSWORDS.admin) {
        adminUnlocked = true;
        lockErrorMessage = "";
      } else {
        lockErrorMessage = "Mot de passe administrateur incorrect.";
      }
      render();
    };

    window.saveScriptUrl = function(e) {
      e.preventDefault();
      const val = document.getElementById("script-url-input").value.trim();
      localStorage.setItem("appsScriptUrl_G2", val);
      render();
    };

    window.exportSubmissionsCsv = function() {
      const rows = getSubmissions();
      if (!rows.length) return;
      const headers = ["Date", "Numero", "Nom", "Classe", "ScoreBrut", "NoteSur20"];
      const csvLines = [
        headers.join(";"),
        ...rows.map(r => [r.date, r.numero, r.nom, r.classe, r.scoreBrut, r.noteSur20]
          .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`)
          .join(";"))
      ];
      const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resultats_examens_g2.csv";
      a.click();
      URL.revokeObjectURL(url);
    };

    window.clearSubmissions = function() {
      localStorage.removeItem("examSubmissions_G2");
      render();
    };

    function render() {
      const area = document.getElementById("content-area");
      const classData = DATA[currentClass];

      if (currentTab === "admin") {
        if (!adminUnlocked) {
          area.innerHTML = renderLockScreen(
            "Accès Administrateur",
            "Saisissez le mot de passe admin pour consulter le suivi des élèves et les paramètres.",
            "handleAdminUnlock"
          );
          return;
        }

        const submissions = getSubmissions();
        const completed = getCompletedModules();
        const totalModules = Object.values(DATA).reduce((acc, c) => acc + c.cours.length, 0);

        area.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
            <h2>Tableau de bord Administrateur</h2>
            <div>
              <button class="btn small" onclick="exportSubmissionsCsv()">Exporter CSV</button>
              <button class="btn danger small" onclick="clearSubmissions()">Effacer l'historique local</button>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div>Soumissions enregistrées (local)</div>
              <div class="stat-value">${submissions.length}</div>
            </div>
            <div class="stat-card">
              <div>Modules marqués lus (appareil)</div>
              <div class="stat-value">${completed.length} / ${totalModules}</div>
            </div>
            <div class="stat-card">
              <div>Classe active</div>
              <div class="stat-value">${currentClass}</div>
            </div>
          </div>

          <h3 style="margin-bottom:8px;">Évolution des soumissions d'examens (historique de cet appareil)</h3>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>N°</th>
                <th>Nom et Prénoms</th>
                <th>Classe</th>
                <th>Score</th>
                <th>Note /20</th>
              </tr>
            </thead>
            <tbody>
              ${submissions.length ? submissions.map(s => `
                <tr>
                  <td>${new Date(s.date).toLocaleString("fr-FR")}</td>
                  <td>${s.numero}</td>
                  <td>${s.nom}</td>
                  <td>${s.classe}</td>
                  <td>${s.scoreBrut}</td>
                  <td><strong>${s.noteSur20}/20</strong></td>
                </tr>
              `).join("") : `<tr><td colspan="6">Aucune soumission enregistrée sur cet appareil pour le moment.</td></tr>`}
            </tbody>
          </table>

          <h3 style="margin-top:20px; margin-bottom:8px;">URL Google Apps Script</h3>
          <form onsubmit="saveScriptUrl(event)">
            <input type="text" id="script-url-input" value="${getAppsScriptUrl()}" placeholder="https://script.google.com/macros/s/.../exec" />
            <button type="submit" class="btn small" style="margin-top:8px;">Enregistrer l'URL</button>
          </form>
        `;
        return;
      }

      if (!unlockedClasses.has(currentClass)) {
        area.innerHTML = renderLockScreen(
          `Classe verrouillée : ${currentClass}`,
          `Entrez le mot de passe de la classe ${currentClass} (${classData.titre}) pour accéder aux cours, exercices et examens.`,
          "handleClassUnlock"
        );
        return;
      }

      if (currentTab === "cours") {
        const completed = getCompletedModules();
        area.innerHTML = `
          <h2 style="margin-bottom:14px;">Cours — ${currentClass} : ${classData.titre}</h2>
          ${classData.cours.map(mod => {
            const isDone = completed.includes(mod.id);
            return `
              <div class="module-card">
                <div class="module-header">
                  <div class="module-title">${mod.titre}</div>
                  <span class="badge ${isDone ? "done" : ""}">${isDone ? "Terminé" : "À lire"}</span>
                </div>
                <div class="objective">Objectif : ${mod.objectif}</div>
                ${mod.contenuHtml}
                <button class="btn" onclick="toggleModuleDone('${mod.id}')">
                  ${isDone ? "Marquer comme non lu" : "Marquer comme lu"}
                </button>
                <button class="btn secondary" onclick="selectTab('exercices')">Aller aux exercices</button>
              </div>
            `;
          }).join("")}
        `;
      } else if (currentTab === "exercices") {
        area.innerHTML = `
          <h2 style="margin-bottom:14px;">Exercices d'entraînement — ${currentClass}</h2>
          <form id="exo-form">
            ${classData.exercices.map((item, idx) => `
              <div class="question-box">
                <p><strong>${idx + 1}. ${item.q}</strong></p>
                ${item.options.map((opt, oIdx) => `
                  <label><input type="radio" name="exo_${idx}" value="${oIdx}" required /> ${opt}</label>
                `).join("")}
              </div>
            `).join("")}
            <button type="submit" class="btn">Vérifier mes réponses</button>
          </form>
          <div id="exo-result"></div>
        `;
        document.getElementById("exo-form").onsubmit = (e) => {
          e.preventDefault();
          let score = 0;
          classData.exercices.forEach((item, idx) => {
            const chosen = Number(document.querySelector(`input[name="exo_${idx}"]:checked`).value);
            if (chosen === item.answer) score++;
          });
          const res = document.getElementById("exo-result");
          res.className = "feedback ok";
          res.textContent = `Score d'entraînement (${currentClass}) : ${score} / ${classData.exercices.length}`;
        };
      } else if (currentTab === "examen") {
        if (!examUnlocked) {
          area.innerHTML = renderLockScreen(
            `Examen sécurisé — ${currentClass}`,
            "L'épreuve est verrouillée. Saisissez le mot de passe d'examen donné par l'enseignant.",
            "handleExamUnlock"
          );
          return;
        }

        area.innerHTML = `
          <h2 style="margin-bottom:14px;">Examen — ${currentClass} (${classData.titre})</h2>
          <form id="exam-form">
            <div class="form-grid">
              <div>
                <label for="student-num"><strong>N° Élève</strong></label>
                <input type="text" id="student-num" placeholder="Ex. 12" required />
              </div>
              <div>
                <label for="student-name"><strong>Nom et Prénoms</strong></label>
                <input type="text" id="student-name" placeholder="Ex. RAKOTO Jean" required />
              </div>
              <div>
                <label for="student-class"><strong>Classe</strong></label>
                <input type="text" id="student-class" value="${currentClass}" readonly />
              </div>
            </div>
            ${classData.examen.map((item, idx) => `
              <div class="question-box">
                <p><strong>${idx + 1}. ${item.q}</strong></p>
                ${item.options.map((opt, oIdx) => `
                  <label><input type="radio" name="exam_${idx}" value="${oIdx}" required /> ${opt}</label>
                `).join("")}
              </div>
            `).join("")}
            <button type="submit" class="btn">Soumettre l'examen</button>
          </form>
          <div id="exam-result"></div>
        `;
        document.getElementById("exam-form").onsubmit = async (e) => {
          e.preventDefault();
          const numero = document.getElementById("student-num").value.trim();
          const nom = document.getElementById("student-name").value.trim();
          let score = 0;
          classData.examen.forEach((item, idx) => {
            const chosen = Number(document.querySelector(`input[name="exam_${idx}"]:checked`).value);
            if (chosen === item.answer) score++;
          });
          const noteSur20 = ((score / classData.examen.length) * 20).toFixed(2);
          const payload = {
            date: new Date().toISOString(),
            numero,
            nom,
            classe: currentClass,
            scoreBrut: `${score}/${classData.examen.length}`,
            noteSur20
          };

          saveSubmission(payload);

          const scriptUrl = getAppsScriptUrl();
          const res = document.getElementById("exam-result");
          if (!scriptUrl || scriptUrl.includes("VOTRE_URL")) {
            res.className = "feedback ok";
            res.textContent = `Examen corrigé pour N° ${numero} — ${nom} (${currentClass}) : ${noteSur20}/20. Enregistré dans l'historique local (configurez l'URL Apps Script dans Admin pour Google Sheets).`;
            return;
          }

          try {
            await fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            res.className = "feedback ok";
            res.textContent = `Examen soumis pour N° ${numero} — ${nom} (${currentClass}) : ${noteSur20}/20. Envoyé vers Google Sheets.`;
          } catch (err) {
            res.className = "feedback err";
            res.textContent = `Erreur d'envoi vers Google Sheets. Note calculée : ${noteSur20}/20.`;
          }
        };
      }
    }

    render();
  </script>
</body>
</html>
